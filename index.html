const getMajorCategory = (m='') => {
  const s = m.toLowerCase();
  if(/공학|기계|전기|전자|통신|화학|화공|토목|건축|설비|에너지|안전|환경/.test(s)) return 'ENG';
  if(/경영|경제|상경|무역|회계|세무|부동산/.test(s)) return 'BUS';
  if(/문학|어학|행정|법학|심리|언론|홍보|커뮤니케이션|미디어|광고|교육/.test(s)) return 'HUM';
  if(/컴퓨터|소프트웨어|정보|통계|수학|공간정보|지적/.test(s)) return 'IT';
  return 'OTHER';
};
const countItems = s => (s||'').split(',').filter(x=>x.trim()).length;

const getDeptList = hq => [...new Set((JOB_DATABASE[hq]||[]).map(j=>j.dept))];
const calcTenure = dateStr => {
  if(!dateStr) return 0;
  const d = new Date(dateStr); if(isNaN(d)) return 0;
  const now = new Date();
  let y = now.getFullYear()-d.getFullYear();
  if(now.getMonth()<d.getMonth()||(now.getMonth()===d.getMonth()&&now.getDate()<d.getDate())) y--;
  return Math.max(0,y);
};
const inferLeadershipStyle = scores => {
  const st = {
    "성과주도형":(+scores.goal + +scores.dev + +scores.prob)/3,
    "소통협력형":(+scores.comm + +scores.collab + +scores.feedback)/3,
    "안정관리형":(+scores.res + +scores.rule + +scores.data)/3,
    "전략혁신형":(+scores.prob + +scores.flex + +scores.data)/3,
  };
  return Object.keys(st).reduce((a,b)=>st[a]>st[b]?a:b);
};

const calculateSuitability = (cand, job) => {
  if(!cand||!job) return null;
  let score=0; const details={};
  const candExp=(cand.experience||'').replace(/\s+/g,'').toLowerCase();
  const candCerts=(cand.certs||'').replace(/\s+/g,'').toLowerCase();
  const candTrain=(cand.training||'').replace(/\s+/g,'').toLowerCase();
  const candMajor=(cand.major||'').replace(/\s+/g,'').toLowerCase();
  const coreExpKw=job.keywords.map(k=>k.replace(/\s+/g,'').toLowerCase());
  const coreCerts=job.certs.map(c=>c.replace(/\s+/g,'').toLowerCase());
  const cleanCandExp=candExp.replace(/[[\]()]/g,'');
  const cleanJobTitle=job.title.replace(/\s+/g,'').toLowerCase();
  const isExact=cleanCandExp.includes(cleanJobTitle);
  const isRelated=(job.relatedJobs||[]).some(r=>cleanCandExp.includes(r.replace(/\s+/g,'').toLowerCase()));
  if(candExp&&(isExact||coreExpKw.some(k=>cleanCandExp.includes(k)))){score+=40;details.exp={score:40,label:"상(필수직무)"};}
  else if(candExp&&isRelated){score+=28;details.exp={score:28,label:"중(매칭직무)"};}
  else{score+=16;details.exp={score:16,label:"하(타직무)"};}
  if(candCerts&&coreCerts.some(c=>candCerts.includes(c))){score+=20;details.cert={score:20,label:"상(필수/우대)"};}
  else if(candCerts.length>2&&/기사|산업기사|기능장|기능사|지도사|회계사|노무사|세무사|평가사|면허/.test(candCerts)){score+=14;details.cert={score:14,label:"중(일반자격)"};}
  else{score+=8;details.cert={score:8,label:"하(무관/공통)"};}
  const isGenTrain=/공통|일반|HR|기본|기초|소양|리더십|사내|필수|안전보건|입문/.test(candTrain);
  if(candTrain.length>2&&(coreExpKw.some(k=>candTrain.includes(k))||candTrain.includes(cleanJobTitle))){score+=15;details.train={score:15,label:"상(직무전문교육)"};}
  else if(candTrain.length>2&&isGenTrain){score+=10.5;details.train={score:10.5,label:"중(일반HR교육)"};}
  else{score+=6;details.train={score:6,label:"하(이력없음/무관)"};}
  const pm={'S':5,'A':4,'B':3,'C':2,'D':1};
  const avgPerf=((pm[cand.perf2023]||3)+(pm[cand.perf2024]||3)+(pm[cand.perf2025]||3))/3;
  if(avgPerf>=4){score+=10;details.perf={score:10,label:"상(S/A)"};}
  else if(avgPerf>=3){score+=7;details.perf={score:7,label:"중(B)"};}
  else{score+=4;details.perf={score:4,label:"하(C이하)"};}
  const cl=BAND_LEVELS[cand.band]||4,rl=BAND_LEVELS[job.band]||4,bd=Math.abs(cl-rl);
  if(bd===0){score+=10;details.band={score:10,label:"상(일치)"};}
  else if(bd===1){score+=7;details.band={score:7,label:"중(1단계)"};}
  else{score+=4;details.band={score:4,label:"하(2단계↑)"};}
  const isAny=job.majors.includes("전공무관");
  const matchedMajor=job.majors.find(m=>m!=="전공무관"&&candMajor.includes(m.replace(/\s+/g,'').toLowerCase()));
  const cc=getMajorCategory(candMajor),jc=job.majors.map(m=>getMajorCategory(m));
  if(matchedMajor){score+=5;details.major={score:5,label:"상(우대전공)"};}
  else if(candMajor&&(isAny||jc.includes(cc))){score+=3.5;details.major={score:3.5,label:"중(유사/무관)"};}
  else{score+=2;details.major={score:2,label:"하(계열다름)"};}
  const summary=`최근 3년 평균 성과는 ${avgPerf>=4?'우수하며':'무난하며'}, 직무로드 기준 ${details.exp.score===40?'타겟 직무와 일치하는 핵심 수행 경험을 보유하고 있습니다.':details.exp.score===28?'매칭 직무 수행 경험이 있어 원활한 직무 전환이 가능할 것으로 보입니다.':'유관 직무 경험이 부족하여 배치 시 온보딩이 요구됩니다.'}`;
  return {total:Number(score.toFixed(1)),details,summary};
};

const calculatePromotionScore = (cand) => {
  let score=0;
  const isLeader=BAND_LEVELS[cand.band]>=5;
  const maxScore=isLeader?800:500;
  const d={};
  const sMap={'S':4.5,'A':4.0,'B':3.5,'C':3.0,'D':2.5,'N/A':null};
  const pMap={'S':100,'A':80,'B':60,'C':40,'D':20,'N/A':null};
  const ed=[
    {grade:cand.perf2025,gpa:sMap[cand.perf2025],pts:pMap[cand.perf2025],w5:0.40,w3:0.50},
    {grade:cand.perf2024,gpa:sMap[cand.perf2024],pts:pMap[cand.perf2024],w5:0.25,w3:0.30},
    {grade:cand.perf2023,gpa:sMap[cand.perf2023],pts:pMap[cand.perf2023],w5:0.15,w3:0.20},
    {grade:cand.perf2022,gpa:sMap[cand.perf2022],pts:pMap[cand.perf2022],w5:0.10,w3:0},
    {grade:cand.perf2021,gpa:sMap[cand.perf2021],pts:pMap[cand.perf2021],w5:0.10,w3:0}
  ];
  const vg=ed.slice(0,3).map(e=>e.gpa).filter(v=>v!==null);
  const avg3=vg.length>0?Number((vg.reduce((a,b)=>a+b,0)/vg.length).toFixed(2)):0;
  const p25=ed[0].gpa!==null?ed[0].gpa:0;
  const tenure=calcTenure(cand.promotionDate);
  let isEligible=true,failReason='';
  if(cand.band==='B4(8)'||cand.band==='B3(7)'){if(tenure<3){isEligible=false;failReason="체류연한 3년 미달";}else if(p25<4.0){isEligible=false;failReason="당해 평가 A 미달";}else if(avg3<4.0){isEligible=false;failReason="유효 평가 평균 4.0 미달";}}
  else if(cand.band==='B3(6)'){if(tenure<3){isEligible=false;failReason="체류연한 3년 미달";}else if(p25<3.5){isEligible=false;failReason="당해 평가 B 미달";}else if(avg3<3.5){isEligible=false;failReason="유효 평가 평균 3.5 미달";}}
  else if(cand.band==='B2(5)'){if(tenure<3){isEligible=false;failReason="체류연한 3년 미달";}else if(p25<4.0){isEligible=false;failReason="당해 평가 A 미달";}else if(avg3<3.5){isEligible=false;failReason="유효 평가 평균 3.5 미달";}}
  else if(cand.band==='B2(4)'){if(tenure<3){isEligible=false;failReason="체류연한 3년 미달";}else if(p25<3.5){isEligible=false;failReason="당해 평가 B 미달";}else if(avg3<3.0){isEligible=false;failReason="유효 평가 평균 3.0 미달";}}
  else{if(tenure<2){isEligible=false;failReason="체류연한 2년 미달";}else if(p25<4.0){isEligible=false;failReason="당해 평가 A 미달";}else if(avg3<3.0){isEligible=false;failReason="유효 평가 평균 3.0 미달";}}
  let vws=0,wps=0;
  if(isLeader){ed.forEach(e=>{if(e.pts!==null){vws+=e.w5;wps+=e.pts*e.w5;}});d.perf=vws>0?(wps/vws)*2.5:0;}
  else{ed.slice(0,3).forEach(e=>{if(e.pts!==null){vws+=e.w3;wps+=e.pts*e.w3;}});d.perf=vws>0?(wps/vws)*2:0;}
  d.perf=Math.round(d.perf*10)/10;
  let isUpwardTrend=false;
  const trendArr=ed.map(e=>e.pts).filter(v=>v!==null).reverse();
  if(trendArr.length>=3){let uc=0;for(let i=0;i<trendArr.length-1;i++){if(trendArr[i+1]>trendArr[i])uc++;}if(uc>=2)isUpwardTrend=true;}
  d.trendBonus=isUpwardTrend?10:0;
  score+=d.perf+d.trendBonus;
  d.jobPerformCount=countItems(cand.jobPerformText);
  d.jobPerform=d.jobPerformCount>=(isLeader?2:1)?100:0;
  score+=d.jobPerform;
  d.awardCount=countItems(cand.awardsText);
  d.awards=Math.min(d.awardCount*10,30);
  score+=d.awards;
  const pa=ed.map(e=>e.grade).filter(g=>g!=='N/A');
  let isUnderC=false;
  for(let i=0;i<pa.length-1;i++){if(['C','D'].includes(pa[i])&&['C','D'].includes(pa[i+1])){isUnderC=true;break;}}
  d.underC=isUnderC?-10:0;
  score+=d.underC;
  d.collab=Number(cand.collab)||0;score+=d.collab;
  d.attendance=Math.max(50-((Number(cand.tardyCount)||0)*10),0);score+=d.attendance;
  d.penalty=hasText(cand.penaltyText)?30:0;score-=d.penalty;
  d.culture=Number(cand.culture)||0;score+=d.culture;
  d.knowledge=hasText(cand.knowledgeText)?(isLeader?50:10):0;score+=d.knowledge;
  d.leader=hasText(cand.leaderText)?(isLeader?50:15):0;score+=d.leader;
  d.tf=hasText(cand.tfText)?(isLeader?40:10):0;score+=d.tf;
  d.instructor=hasText(cand.instructorText)?(isLeader?30:10):0;score+=d.instructor;
  d.mentoring=hasText(cand.mentoringText)?(isLeader?30:10):0;score+=d.mentoring;
  d.cert=hasText(cand.certText)?(isLeader?30:10):0;score+=d.cert;
  d.specialist=hasText(cand.specialistText)?(isLeader?20:10):0;score+=d.specialist;
  let summary='';
  if(!isEligible){summary=`[기본 조건 불충족] 사유: ${failReason}. 체류연한 ${tenure}년 및 유효 평균 ${avg3}점.`;score=0;}
  else{summary=`[기본 조건 통과] 체류연한 ${tenure}년, 유효 평균 ${avg3}점. 주요성과 ${d.jobPerformCount}건 반영됨.`;}
  return {score:Math.round(score),maxScore,details:d,summary,isLeader,isEligible,failReason,tenure,isUpwardTrend,evals:ed.map(e=>e.grade)};
};

const calculateLeaderScore = (cand, leaderTargetHQ, leaderTargetDept, prefLeaderType) => {
  let score=0;const d={};
  const deptJobs=(JOB_DATABASE[leaderTargetHQ]||[]).filter(j=>j.dept===leaderTargetDept).map(j=>j.title.replace(/\s+/g,'').toLowerCase());
  const cleanExp=(cand.experience||'').replace(/\s+/g,'').toLowerCase();
  const hasDeptExp=deptJobs.some(j=>cleanExp.includes(j));
  d.exp=hasDeptExp?30:10;score+=d.exp;
  const sm={'S':5,'A':4,'B':3,'C':2,'D':1,'N/A':null};
  const evals=[cand.perf2025,cand.perf2024,cand.perf2023,cand.perf2022,cand.perf2021];
  const ev=evals.map(v=>sm[v]).filter(v=>v!==null);
  let evalScore=0,isUpward=false;
  if(ev.length>0){
    const avg=ev.reduce((a,b)=>a+b,0)/ev.length;
    evalScore=(avg/5)*20;
    const chr=[...ev].reverse();
    if(chr.length>=3){let uc=0;for(let i=0;i<chr.length-1;i++){if(chr[i+1]>chr[i])uc++;}if(uc>=2)isUpward=true;}
  }
  d.perf=Math.round(evalScore+(isUpward?5:0));score+=d.perf;
  let cs=0;
  if(Number(cand.vacationRate)>=80)cs+=5;
  if(Number(cand.tardyCount)===0)cs+=5;
  if((Number(cand.overtime)||0)<=40)cs+=5;
  if(hasText(cand.penaltyText))cs-=15;
  d.compliance=Math.max(0,cs);score+=d.compliance;
  const attSum=Object.values(cand.evalScores||{}).reduce((a,b)=>a+Number(b),0);
  d.attitude=Math.round((attSum/100)*15);score+=d.attitude;
  const infStyle=inferLeadershipStyle(cand.evalScores||{});
  d.leaderMatch=(infStyle===prefLeaderType)?15:5;score+=d.leaderMatch;
  const total=Math.min(score,100);
  const isRecommended=total>=80;
  const summary=`[${leaderTargetDept}] 직무 경험 ${hasDeptExp?'보유(적합)':'부족'}. 5년 평가 ${isUpward?'우상향 추세':'무난'}. AI 리더십 추론 결과 [${infStyle}] 성향으로 분석되어, 선호 유형(${prefLeaderType})과 ${infStyle===prefLeaderType?'일치함':'불일치함'}.`;
  return {total,details:d,summary,isRecommended,inferredStyle:infStyle,evals};
};

                <button onClick={handleAnalyze} style={{...S.btn('ghost'),border:'1px solid #bae6fd',color:'#0284c7',fontSize:12}}>↻ 갱신</button>
              </div>
              {[['B2(5) 이하 (실무자)',c=>BAND_LEVELS[c.band]<=4],['B3(6) 이상 (리더)',c=>BAND_LEVELS[c.band]>=5]].map(([title,filter],gi)=>{
                const g=analyzedPromo.filter(filter);
                if(!g.length) return null;
                return (
                  <div key={title} style={{marginBottom:24,paddingTop:gi?16:0,borderTop:gi?'1px solid #e2e8f0':'none'}}>
                    <div style={{fontSize:12,fontWeight:700,color:'#0c4a6e',marginBottom:10,display:'flex',alignItems:'center',gap:8,borderBottom:'1px solid #e2e8f0',paddingBottom:8}}>
                      <span style={{background:'#dbeafe',color:'#1d4ed8',padding:'2px 10px',borderRadius:6}}>{title}</span>승급 심사 명단
                    </div>
                    {g.map((c,i)=>renderCard(c,i))}
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </div>
    );
  };

  const renderLeaderReport = () => (
    <div style={S.card}>
      <div style={S.cardHeader}>
        <div style={{display:'flex',alignItems:'center',gap:10}}><div style={{background:'#e0f2fe',padding:8,borderRadius:10,color:'#0284c7',display:'flex'}}><Icon name="Award" size={18}/></div><span style={{fontSize:18,fontWeight:800}}>AI 직책자 추천 리포트</span></div>
      </div>
      <div style={{padding:24}}>
        {!analyzedLeader.length?(
          <div style={{textAlign:'center',padding:'60px 24px',background:'#f8fafc',borderRadius:16,border:'2px dashed #e2e8f0'}}>
            <div style={{width:56,height:56,borderRadius:'50%',background:'white',border:'1px solid #e2e8f0',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 16px'}}><Icon name="UserCheck" size={24}/></div>
            <div style={{fontSize:18,fontWeight:900,marginBottom:8}}>분석 준비 완료</div>
            <div style={{display:'flex',flexWrap:'wrap',gap:8,justifyContent:'center',margin:'12px 0'}}>
              {leaderJobFilters.map(f=>(
                <span key={f} style={{...S.tag('sky'),gap:6}}>{f}<button onClick={()=>setLeaderJobFilters(p=>p.filter(i=>i!==f))} style={{background:'none',border:'none',cursor:'pointer',color:'#0284c7',padding:0,display:'flex'}}><Icon name="XCircle" size={12}/></button></span>
              ))}
            </div>
            <select value="" onChange={e=>{if(e.target.value&&!leaderJobFilters.includes(e.target.value))setLeaderJobFilters(p=>[...p,e.target.value]);}} style={{...S.select,width:'auto',marginBottom:16,padding:'8px 16px',borderRadius:12}}>
              <option value="">+ 필수 경험 직무 추가</option>
              {ALL_UNIQUE_JOB_TITLES.map(t=><option key={t} value={t}>{t}</option>)}
            </select>
            <br/>
            <button onClick={handleAnalyze} style={{...S.btn('primary'),padding:'14px 40px',borderRadius:999,fontSize:15,boxShadow:'0 4px 14px rgba(2,132,199,.4)'}}><Icon name="PlayCircle" size={20}/>추천 시작</button>
          </div>
        ):(
          <div>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
              <span style={{fontSize:13,fontWeight:700,color:'#0c4a6e'}}>추천 리스트 (100점 만점)</span>
              <div style={{display:'flex',gap:8}}>
                <select value="" onChange={e=>{if(e.target.value&&!leaderJobFilters.includes(e.target.value))setLeaderJobFilters(p=>[...p,e.target.value]);}} style={{...S.select,width:'auto',fontSize:12}}>
                  <option value="">+ 필터 추가</option>
                  {ALL_UNIQUE_JOB_TITLES.map(t=><option key={t} value={t}>{t}</option>)}
                </select>
                <button onClick={handleAnalyze} style={{...S.btn('ghost'),border:'1px solid #bae6fd',color:'#0284c7',fontSize:12}}>↻ 갱신</button>
              </div>
            </div>
            {analyzedLeader.map((cand,idx)=>{
              const {total,details,summary,isRecommended,evals,inferredStyle}=cand.evaluation;
              return (
                <div key={cand.id} style={{display:'flex',gap:16,flexWrap:'wrap',border:`2px solid ${isRecommended?'#38bdf8':'#e2e8f0'}`,borderRadius:14,padding:14,marginBottom:12,background:'white',alignItems:'center'}}>
                  <div style={{flexShrink:0,width:30,display:'flex',justifyContent:'center'}}><div style={{width:28,height:28,borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700,fontSize:13,background:idx===0?'#0284c7':'#f1f5f9',color:idx===0?'white':'#64748b'}}>{idx+1}</div></div>
                  <div style={{width:180,flexShrink:0,borderRight:'1px solid #f1f5f9',paddingRight:14}}>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4}}>
                      <span style={{fontSize:16,fontWeight:900,color:'#1e293b'}}>{cand.name}</span>
                      <span style={{fontSize:22,fontWeight:900,color:isRecommended?'#0284c7':'#94a3b8',lineHeight:1}}>{total}</span>
                    </div>
                    <div style={{fontSize:11,color:'#94a3b8',fontWeight:600,marginBottom:8}}>{cand.currentDept} | {cand.band}</div>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:6}}>
                      <Sparkline evalsArr={[...evals].reverse()}/>
                      <span style={{...S.tag(inferredStyle===prefLeaderType?'sky':''),fontSize:10}}>{inferredStyle}</span>
                    </div>
                    <div style={{height:5,background:'#e2e8f0',borderRadius:999,overflow:'hidden'}}><div style={{height:'100%',width:`${total}%`,background:isRecommended?'#0284c7':'#94a3b8'}}/></div>
                  </div>
                  <div style={{flex:1}}>
                    <div style={{fontSize:11,fontWeight:600,lineHeight:1.6,padding:'8px 10px',borderRadius:8,marginBottom:8,background:'#f8fafc',color:'#475569',wordBreak:'keep-all'}}>{summary}</div>
                    <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                      <span style={{...S.tag('sky'),fontSize:10}}>부서경험: {details.exp}/30</span>
                      <span style={{...S.tag('sky'),fontSize:10}}>평가추이: {details.perf}/25</span>
                      <span style={{...S.tag('green'),fontSize:10}}>제도준수: {details.compliance}/15</span>
                      <span style={{...S.tag('green'),fontSize:10}}>태도수시: {details.attitude}/15</span>
                      <span style={{...S.tag('sky'),fontSize:10}}>리더매칭: {details.leaderMatch}/15</span>
                    </div>
                  </div>
                  <div style={{width:110,flexShrink:0,borderLeft:'1px solid #f1f5f9',paddingLeft:14}}>
                    <div style={{textAlign:'center',padding:'8px 0',borderRadius:8,fontSize:11,fontWeight:800,border:`2px solid ${isRecommended?'#0284c7':'#e2e8f0'}`,background:isRecommended?'#f0f9ff':'#f8fafc',color:isRecommended?'#0284c7':'#94a3b8'}}>{isRecommended?'추천 적합':'보류'}</div>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );

  const TabBar = ({tabs,active,setActive}) => (
    <div style={{display:'flex',background:'white',padding:6,borderRadius:14,border:'1px solid #e2e8f0',boxShadow:'0 1px 3px rgba(0,0,0,.06)',marginBottom:20,overflowX:'auto'}}>
      {tabs.map(([key,label])=>(
        <button key={key} onClick={()=>setActive(key)} style={{flexShrink:0,padding:'8px 24px',borderRadius:10,border:'none',cursor:'pointer',fontFamily:'inherit',fontSize:13,fontWeight:700,background:active===key?'#f0f9ff':'transparent',color:active===key?'#0284c7':'#94a3b8',transition:'all .2s'}}>{label}</button>
      ))}
    </div>
  );

  return (
    <div style={{minHeight:'100vh',background:'#F4F7FA',padding:'16px',userSelect:'none'}}>
      {confirm.open&&(
        <div style={{position:'fixed',inset:0,zIndex:999,display:'flex',alignItems:'center',justifyContent:'center',background:'rgba(15,23,42,.4)',backdropFilter:'blur(4px)'}}>
          <div style={{background:'white',borderRadius:20,boxShadow:'0 20px 60px rgba(0,0,0,.2)',padding:28,maxWidth:360,width:'100%',margin:'0 16px'}}>
            <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:12}}><div style={{background:'#fee2e2',padding:8,borderRadius:'50%',display:'flex'}}><Icon name="AlertCircle" size={18}/></div><span style={{fontSize:17,fontWeight:900}}>확인</span></div>
            <p style={{fontSize:13,color:'#475569',marginBottom:24,lineHeight:1.6}}>{confirm.text}</p>
            <div style={{display:'flex',justifyContent:'flex-end',gap:8}}>
              <button onClick={()=>setConfirm({open:false,text:'',action:null})} style={{...S.btn('ghost'),border:'1px solid #e2e8f0',padding:'9px 20px',borderRadius:10}}>취소</button>
              <button onClick={confirm.action} style={{...S.btn('danger'),padding:'9px 20px',borderRadius:10}}>확인</button>
            </div>
          </div>
        </div>
      )}
      {toast&&(
        <div className="animate-in" style={{position:'fixed',bottom:32,right:32,background:'rgba(15,23,42,.95)',color:'white',padding:'14px 22px',borderRadius:14,boxShadow:'0 8px 32px rgba(0,0,0,.2)',display:'flex',alignItems:'center',gap:10,zIndex:9999,backdropFilter:'blur(8px)'}}>
          <Icon name="CheckCircle" size={18}/><span style={{fontWeight:700,fontSize:13}}>{toast}</span>
        </div>
      )}

      <div style={{maxWidth:1400,margin:'0 auto'}}>
        {/* 헤더 */}
        <header style={{...S.card,display:'flex',flexWrap:'wrap',justifyContent:'space-between',alignItems:'center',gap:16,padding:'16px 24px',marginBottom:20,position:'sticky',top:12,zIndex:40,background:'rgba(255,255,255,.95)',backdropFilter:'blur(12px)'}}>
          <h1 style={{fontSize:20,fontWeight:900,color:'#1e293b',display:'flex',alignItems:'center',gap:10}}>
            <div style={{background:'linear-gradient(135deg,#0284c7,#0369a1)',padding:10,borderRadius:14,color:'white',display:'flex',boxShadow:'0 4px 12px rgba(2,132,199,.3)'}}><Icon name="Settings" size={20}/></div>
            HR 인재추천 시스템
          </h1>
          <div style={{display:'flex',background:'#f1f5f9',padding:6,borderRadius:16,border:'1px solid #e2e8f0',gap:4,overflowX:'auto'}}>
            {[['transfer','사내 이동','ArrowRightLeft'],['promotion','승급 심사','TrendingUp'],['leadership','직책자 추천','UserCheck']].map(([key,label,icon])=>(
              <button key={key} onClick={()=>setMainCat(key)} style={{flexShrink:0,display:'flex',alignItems:'center',gap:6,padding:'8px 20px',borderRadius:12,border:'none',cursor:'pointer',fontFamily:'inherit',fontSize:13,fontWeight:800,background:mainCat===key?'white':'transparent',color:mainCat===key?'#0284c7':'#94a3b8',boxShadow:mainCat===key?'0 1px 4px rgba(0,0,0,.1)':'none',transition:'all .2s'}}>
                <Icon name={icon} size={14}/>{label}
              </button>
            ))}
          </div>
          <button onClick={resetAll} title="초기화" style={{...S.btn('ghost'),border:'1px solid #e2e8f0',padding:'8px 14px',borderRadius:10}}>
            <Icon name="RotateCcw" size={16}/>
          </button>
        </header>

        {/* 사내 이동 */}
        {mainCat==='transfer'&&(
          <div className="animate-in">
            <TabBar tabs={[['jobSelection','1. 타겟 직무 및 후보자 등록'],['ranking','2. AI 적합도 리포트']]} active={activeTab} setActive={setActiveTab}/>
            {activeTab==='jobSelection'&&<div style={{display:'flex',flexDirection:'column',gap:16}}>{renderJobSelection()}{renderJobCriteria()}{renderCandidateReg('transfer')}</div>}
            {activeTab==='ranking'&&<div style={{display:'flex',flexDirection:'column',gap:16}}>{renderJobCriteria()}{renderRanking()}</div>}
          </div>
        )}

        {/* 승급 심사 */}
        {mainCat==='promotion'&&(
          <div className="animate-in">
            <TabBar tabs={[['registration','1. 승급 대상자 등록'],['report','2. AI 승급 리포트']]} active={promoTab} setActive={setPromoTab}/>
            {promoTab==='registration'&&renderCandidateReg('promotion')}
            {promoTab==='report'&&renderPromoReport()}
          </div>
        )}

        {/* 직책자 추천 */}
        {mainCat==='leadership'&&(
          <div className="animate-in">
            <TabBar tabs={[['registration','1. 직책자 후보 등록'],['report','2. AI 추천 리포트']]} active={leaderTab} setActive={setLeaderTab}/>
            {leaderTab==='registration'&&(
              <div style={{display:'flex',flexDirection:'column',gap:16}}>
                <div style={S.card}>
                  <div style={S.cardHeader}>
                    <div style={{display:'flex',alignItems:'center',gap:8}}><div style={{background:'#e0f2fe',padding:6,borderRadius:8,color:'#0284c7',display:'flex'}}><Icon name="UserCheck" size={16}/></div><span style={{fontSize:16,fontWeight:800}}>직책자 필요 부서 및 선호 유형 설정</span></div>
                  </div>
                  <div style={{padding:20,display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))',gap:20}}>
                    <div><label style={{display:'block',fontSize:11,fontWeight:700,color:'#64748b',marginBottom:6}}>타겟 본부</label><select value={leaderTargetHQ} onChange={e=>{setLeaderTargetHQ(e.target.value);setLeaderTargetDept(getDeptList(e.target.value)[0]);}} style={S.select}>{Object.keys(JOB_DATABASE).map(hq=><option key={hq} value={hq}>{hq}</option>)}</select></div>
                    <div><label style={{display:'block',fontSize:11,fontWeight:700,color:'#64748b',marginBottom:6}}>타겟 부서</label><select value={leaderTargetDept} onChange={e=>setLeaderTargetDept(e.target.value)} style={S.select}>{getDeptList(leaderTargetHQ).map(d=><option key={d} value={d}>{d}</option>)}</select></div>
                    <div><label style={{display:'block',fontSize:11,fontWeight:700,color:'#64748b',marginBottom:6}}>선호 리더십 유형</label><select value={prefLeaderType} onChange={e=>setPrefLeaderType(e.target.value)} style={{...S.select,background:'#f0f9ff',color:'#0c4a6e',fontWeight:700,border:'1px solid #7dd3fc'}}>{LEADER_STYLES.map(s=><option key={s} value={s}>{s}</option>)}</select></div>
                  </div>
                </div>
                {renderCandidateReg('leadership')}
              </div>
            )}
            {leaderTab==='report'&&renderLeaderReport()}
          </div>
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
